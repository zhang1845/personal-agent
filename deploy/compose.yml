name: daynest
services:
  daynest:
    image: daynest:local
    pull_policy: never
    build:
      context: ..
    env_file: ../private/cloud.env
    environment:
      DAYNEST_DATA_DIR: /data
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - daynest_data:/data
    restart: unless-stopped
    stop_grace_period: 30s
  https:
    image: caddy:2
    profiles: [https]
    depends_on:
      daynest:
        condition: service_healthy
    environment:
      DAYNEST_PUBLIC_URL: ${DAYNEST_PUBLIC_URL:?Set your HTTPS origin in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  daynest_data:
  caddy_data:
  caddy_config:
